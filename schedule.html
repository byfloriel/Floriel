<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Schedule — Floriel</title>
<link rel="stylesheet" href="css/schedule.css">
</head>
<body>

<div class="floriel-schedule">
  <h1>Order Schedule</h1>
  <p class="fs-sub">Check which dates I'm open for bouquet orders.</p>

  <div class="fs-legend">
    <span><span class="fs-dot open"></span> Accepting orders</span>
    <span><span class="fs-dot limited"></span> Limited slots</span>
    <span><span class="fs-dot closed"></span> Not available</span>
  </div>

  <div class="fs-nav">
    <button id="fs-prev" aria-label="Previous month">&#8249;</button>
    <h2 id="fs-month-label"></h2>
    <button id="fs-next" aria-label="Next month">&#8250;</button>
  </div>

  <div class="fs-grid" id="fs-grid"></div>

  <p class="fs-note">Dates with no color haven't been set yet — message me directly to ask.</p>
</div>

<!-- Firebase (read-only on this page) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ---- Fill in with the config from your Firebase project settings ----
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let scheduleData = {};
let current = new Date();
current.setDate(1);

const monthLabel = document.getElementById('fs-month-label');
const grid = document.getElementById('fs-grid');
const dows = ['S','M','T','W','T','F','S'];

function fmtKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function render() {
  const y = current.getFullYear();
  const m = current.getMonth();
  monthLabel.textContent = current.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  grid.innerHTML = '';
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'fs-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayKey = fmtKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement('div');
    el.className = 'fs-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = fmtKey(y, m, d);
    const status = scheduleData[key];
    const el = document.createElement('div');
    el.className = 'fs-day' + (status ? ' ' + status : '') + (key === todayKey ? ' today' : '');
    el.textContent = d;
    grid.appendChild(el);
  }
}

db.collection('availability').doc('data').get().then(doc => {
  scheduleData = doc.exists ? doc.data() : {};
  render();
}).catch(err => {
  console.error('Could not load schedule:', err);
  render();
});

document.getElementById('fs-prev').addEventListener('click', () => {
  current.setMonth(current.getMonth() - 1);
  render();
});
document.getElementById('fs-next').addEventListener('click', () => {
  current.setMonth(current.getMonth() + 1);
  render();
});
</script>

</body>
</html>
